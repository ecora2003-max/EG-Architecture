name: Contract validation
on:
  push:
    paths:
      - 'contracts/**'
      - 'policies/**'
      - 'tools/validate_retailer_source_policy.py'
      - 'policies/**'
      - 'tools/validate_retailer_source_policy.py'
      - 'tools/validate_contract.py'
      - 'requirements-dev.txt'
      - '.github/workflows/contract-validation.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'tools/validate_contract.py'
      - 'requirements-dev.txt'
      - '.github/workflows/contract-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned offline validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate contracts v1 and v1.1
        run: python tools/validate_contract.py
      - name: Validate retailer functional capability matrix
        run: python tools/validate_retailer_source_policy.py
